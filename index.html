<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Text Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .box { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-top: 40px; }
        h2 { color: #0078d4; margin-top: 0; text-align: center; }
        textarea { width: 100%; height: 150px; padding: 15px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; resize: none; box-sizing: border-box; outline: none; transition: 0.3s; }
        textarea:focus { border-color: #0078d4; }
        .stats { display: flex; justify-content: space-between; margin-top: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .stat-item { text-align: center; }
        .stat-item span { display: block; font-size: 24px; font-weight: bold; color: #0078d4; }
    </style>
</head>
<body>

<div class="box">
    <h2>📝 Smart Text Analyzer</h2>
    <textarea id="textInput" placeholder="Type or paste your English paragraphs here to analyze..." oninput="analyzeText()"></textarea>
    
    <div class="stats">
        <div class="stat-item">
            <span id="wordCount">0</span>
            Words
        </div>
        <div class="stat-item">
            <span id="charCount">0</span>
            Characters
        </div>
        <div class="stat-item">
            <span id="readingTime">0</span>
            Min Read
        </div>
    </div>
</div>

<script>
    function analyzeText() {
        const text = document.getElementById('textInput').value;
        
        // कैरेक्टर काउंट
        document.getElementById('charCount').innerText = text.length;
        
        // वर्ड काउंट
        let words = text.trim().split(/\s+/);
        let cleanWordCount = words.filter(word => word.length > 0).length;
        document.getElementById('wordCount').innerText = cleanWordCount;
        
        // रीडिंग टाइम (औसत 200 शब्द प्रति मिनट के हिसाब से)
        let time = Math.ceil(cleanWordCount / 200);
        document.getElementById('readingTime').innerText = cleanWordCount > 0 ? time : 0;
    }
</script>

</body>
</html>
